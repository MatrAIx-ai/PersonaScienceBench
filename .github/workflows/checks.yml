name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PERSONASCIENCEBENCH_SOURCE_ROOT: /tmp/psb-no-external-sources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.26
      - run: uv sync --locked --extra test --extra api --extra annotations
      - run: uv run --locked python -m pytest -q -rs
      - run: uv run --locked python scripts/check_repository.py
