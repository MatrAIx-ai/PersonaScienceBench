# Luna baseline: interactive approved-fact simulator; no persona styling.
# Live preflight refreshes prices; no dollar caps.

[models.actor]
model = "openai/gpt-6-luna"
reasoning_effort = "none"
max_output_tokens = 12288
input_usd_per_million = 0.09999999999999999
output_usd_per_million = 0.5

[models.researcher]
model = "openai/gpt-6-luna"
reasoning_effort = "none"
max_output_tokens = 2048
input_usd_per_million = 0.09999999999999999
output_usd_per_million = 0.5

[models.judge]
model = "openai/gpt-6-luna"
reasoning_effort = "none"
max_output_tokens = 4096
input_usd_per_million = 0.09999999999999999
output_usd_per_million = 0.5

[limits]
actor_steps = 20
researcher_questions = 6
request_timeout_seconds = 120
