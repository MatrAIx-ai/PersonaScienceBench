# Simulator comparison: actor/judge unchanged from pilot-o3mini.toml.
[models.actor]
model = "openai/o3-mini"
max_output_tokens = 12288
input_usd_per_million = 1.10
output_usd_per_million = 4.40
reasoning_effort = "medium"

[models.researcher]
model = "openai/o3-mini"
# Reasoning tokens share this allowance with the short structured answer.
max_output_tokens = 4096
input_usd_per_million = 1.10
output_usd_per_million = 4.40
reasoning_effort = "medium"

[models.judge]
model = "openai/o3-mini"
max_output_tokens = 4096
input_usd_per_million = 1.10
output_usd_per_million = 4.40
reasoning_effort = "medium"

[limits]
actor_steps = 20
researcher_questions = 6
request_timeout_seconds = 120
