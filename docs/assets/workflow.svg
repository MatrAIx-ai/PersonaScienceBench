<svg xmlns="http://www.w3.org/2000/svg" width="860" height="840" viewBox="0 0 860 840" role="img" aria-labelledby="title desc">
  <title id="title">PersonaScienceBench interaction workflow</title>
  <desc id="desc">A persona conditions the researcher simulator. A frozen task supplies researcher context and public actor inputs. The simulator and scientific actor exchange feedback, questions and proposals. The actor uses sandboxed tools where applicable and submits a result for native evaluation.</desc>
