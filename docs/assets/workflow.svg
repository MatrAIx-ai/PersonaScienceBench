  <text x="625" y="76" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#172435" font-size="26" font-weight="600">Scientific task</text>
  <text x="625" y="108" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#465565" font-size="21">Frozen question + inputs</text>
