[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "personasciencebench"
version = "0.1.0"
readme = "README.md"
license = "MIT"
description = "Researcher-persona interactions around independently executed scientific benchmarks"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
annotations = ["pyarrow>=17"]
conversion = ["PyYAML>=6", "huggingface-hub>=0.24", "packaging>=24"]
scientific-evaluation = ["numpy>=1.26", "scipy>=1.11", "pandas>=2", "matplotlib>=3.8", "Pillow>=10"]
api = ["httpx>=0.28,<1"]
actor = ["openhands-sdk==1.49.3"]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[project.scripts]
personasciencebench = "personasciencebench.cli:main"
expbench = "expbench.cli:main"
expbench-realistic = "expbench.realistic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
