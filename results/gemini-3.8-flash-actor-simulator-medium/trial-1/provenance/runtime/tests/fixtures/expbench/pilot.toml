# Model IDs are OpenRouter IDs. The OpenHands adapter adds its provider prefix.
[models.actor]
model = "anthropic/claude-sonnet-5"
max_output_tokens = 12288
input_usd_per_million = 2.0
output_usd_per_million = 10.0

[models.researcher]
model = "anthropic/claude-sonnet-5"
max_output_tokens = 1024
input_usd_per_million = 2.0
output_usd_per_million = 10.0

[models.judge]
model = "openai/o3-mini"
max_output_tokens = 4096
input_usd_per_million = 1.10
output_usd_per_million = 4.40
reasoning_effort = "medium"

[limits]
actor_steps = 20
researcher_questions = 6
# No dollar caps. Optional episode_usd and run_usd can be added if desired.
request_timeout_seconds = 120
